name: Deploy to GitHub Pages

# Every push to main builds the site and publishes it to https://beezyhoney.github.io/ (custom domain beezyhoney.in).
# Until the Cloudflare cutover (admin-portal design, Phase 9) GitHub Pages keeps serving the public site. The build now
# uses @astrojs/cloudflare: the static site is in dist/client (dist/server is the Worker, not used by Pages).
# No secrets are needed: the catalog comes from the committed snapshot and nothing is deployed to Cloudflare.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # sync-catalog (snapshot) → astro build → check-dist
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
